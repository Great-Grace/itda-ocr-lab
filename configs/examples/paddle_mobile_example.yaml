# Optional reference only — this is not the project baseline or a prescribed
# weight choice. Copy it into configs/experiments/ only when a team member
# explicitly wants to test PaddleOCR against the current candidate.
name: paddle_mobile_reference_example

runtime:
  device: cpu
  threads: 4
  max_gpu_hours: 2
  extra_requirements:
    - paddlepaddle-gpu
    - paddleocr

ocr:
  plugin: paddle_mobile
  weight_id: replace_with_approved_weight_id
  params:
    require_local_weights: true
    lang: korean
    det_model_dir: ${ITDA_WEIGHTS_ROOT}/paddle/det
    rec_model_dir: ${ITDA_WEIGHTS_ROOT}/paddle/rec
    use_doc_orientation_classify: false
    use_doc_unwarping: false
    use_textline_orientation: false

selector:
  plugin: keyword_regex
  params:
    keyword_weight: 0.7
    confidence_weight: 0.2
    position_weight: 0.1

normalizer:
  plugin: date_ko_v1
  params: {}
