name: C0_SMOKE_CASCADE
runtime:
  device: cpu
  threads: 4
preprocess:
  plugin: none
  params: {}
ocr:
  plugin: cascade
  weight_id: mock-cascade
  params:
    primary_backend: mock
    cutoff: 2.0
selector:
  plugin: keyword_regex
  params:
    allow_day_first: true
    allow_month_names: true
    keyword_weight: 0.5
    negative_keyword_weight: 0.3
    calendar_weight: 0.5
    pattern_weight: 0.2
    position_weight: 0.15
    partial_date_penalty: 0.35
    time_like_penalty: 0.50
    future_date_bonus: 0.0
normalizer:
  plugin: date_ko_v1
  params:
    none_token: NONE
