name: B19_PARTIAL_TIME_PENALTY_ABLATION
runtime:
  device: cpu
  threads: 4
ocr:
  plugin: paddle_mobile_split
  params: {}
preprocess:
  plugin: none
  params: {}
selector:
  plugin: keyword_regex
  params:
    allow_day_first: true
    allow_month_names: true
    partial_date_penalty: 0.45
    time_like_penalty: 0.60
normalizer:
  plugin: date_ko_v1
  params:
    year_missing_token: NoNE
    none_token: NONE
ablation:
  max_runs: 5
  grid:
    selector.params.partial_date_penalty: [0.20, 0.35, 0.45, 0.60, 0.80]
