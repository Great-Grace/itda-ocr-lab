name: B5_CACHE_RULE_SWEEP

runtime:
  device: cpu
  threads: 4

ocr:
  plugin: mock
  params: {}

preprocess:
  plugin: none
  params: {}

selector:
  plugin: keyword_regex
  params:
    allow_day_first: true
    allow_month_names: true
    keyword_weight: 0.7
    negative_keyword_weight: 0.45
    confidence_weight: 0.2
    detection_confidence_weight: 0.2
    calendar_weight: 0.5
    pattern_weight: 0.25
    position_weight: 0.25
    keep_invalid: false

normalizer:
  plugin: date_ko_v1
  params:
    year_missing_token: NoNE
    none_token: NONE

ablation:
  max_runs: 16
  grid:
    selector.params.allow_day_first: [true, false]
    selector.params.allow_month_names: [true, false]
    selector.params.keyword_weight: [0.7, 1.1]
    selector.params.position_weight: [0.25, 0.6]
