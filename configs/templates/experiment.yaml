name: replace_me

runtime:
  device: cpu
  threads: 4
  max_gpu_hours: 2
  # Optional development-only dependencies for this adapter. Pin exact tested
  # versions in requirements.txt before final submission.
  extra_requirements: []

ocr:
  plugin: replace_me
  # Reference an approved entry in configs/weights.yaml when weights are used.
  weight_id: replace_me
  params: {}

preprocess:
  plugin: none
  params: {}

selector:
  plugin: keyword_regex
  params: {}

normalizer:
  plugin: date_ko_v1
  params: {}

# Optional sweep. Keys are dotted config paths and values are lists.
ablation:
  max_runs: 8
  grid: {}
